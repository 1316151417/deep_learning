<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手写数字识别 - Softmax回归</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px;
    min-height: 100vh;
}
h1 { margin-bottom: 8px; font-size: 24px; }
.subtitle { color: #888; margin-bottom: 24px; font-size: 14px; }
.main {
    display: flex;
    gap: 30px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
}
.canvas-area {
    display: flex;
    flex-direction: column;
    align-items: center;
}
#drawCanvas {
    border-radius: 8px;
    cursor: crosshair;
    touch-action: none;
    border: 2px solid #333;
}
.canvas-info {
    margin-top: 8px;
    font-size: 12px;
    color: #666;
}
.buttons {
    margin-top: 16px;
    display: flex;
    gap: 12px;
}
button {
    padding: 10px 28px;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s;
}
.btn-predict { background: #e94560; color: #fff; }
.btn-predict:hover { background: #c73a52; }
.btn-clear { background: #333; color: #ccc; }
.btn-clear:hover { background: #444; }
.preview-area {
    display: flex;
    flex-direction: column;
    align-items: center;
}
.preview-title {
    font-size: 14px;
    margin-bottom: 8px;
    color: #888;
}
.preview-grid {
    display: grid;
    grid-template-columns: repeat(8, 34px);
    grid-template-rows: repeat(8, 34px);
    gap: 1px;
    background: #333;
    padding: 2px;
    border-radius: 6px;
}
.preview-cell {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-family: monospace;
    border-radius: 2px;
}
.result-area { min-width: 280px; }
.result-title { font-size: 16px; margin-bottom: 12px; color: #aaa; }
.prediction {
    font-size: 72px;
    font-weight: bold;
    text-align: center;
    color: #e94560;
    margin-bottom: 20px;
    min-height: 90px;
}
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: flex; align-items: center; gap: 8px; }
.bar-label { width: 20px; text-align: right; font-size: 14px; color: #aaa; }
.bar-track {
    flex: 1; height: 22px; background: #222;
    border-radius: 4px; overflow: hidden;
}
.bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #e94560, #ff6b6b);
    border-radius: 4px;
    transition: width 0.3s ease;
    min-width: 0;
}
.bar-fill.top { background: linear-gradient(90deg, #0f3460, #16c79a); }
.bar-pct {
    width: 50px; text-align: right; font-size: 13px;
    color: #888; font-family: monospace;
}
</style>
</head>
<body>

<h1>手写数字识别</h1>
<p class="subtitle">Softmax 回归 (手写板绘制 → 8x8 灰阶降采样)</p>

<div class="main">
    <div class="canvas-area">
        <canvas id="drawCanvas" width="280" height="280"></canvas>
        <p class="canvas-info">在手写板上绘制数字，点击预测查看结果</p>
        <div class="buttons">
            <button class="btn-predict" onclick="predict()">预测</button>
            <button class="btn-clear" onclick="clearCanvas()">清除</button>
        </div>
    </div>

    <div class="preview-area">
        <div class="preview-title">8x8 灰阶预览 (模型输入)</div>
        <div class="preview-grid" id="previewGrid"></div>
    </div>

    <div class="result-area">
        <div class="result-title">预测结果</div>
        <div class="prediction" id="prediction">?</div>
        <div class="bars" id="bars"></div>
    </div>
</div>

// =========================================
// softmax
// =========================================
function softmax(logits) {
    const max = Math.max(...logits);
    const exps = logits.map(v => Math.exp(v - max));
    const sum = exps.reduce((a, b) => a + b, 0);
    return exps.map(v => v / sum);
}

// =========================================
// 手写板 Canvas
// =========================================
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
const CANVAS_SIZE = 280;
const BRUSH_SIZE = 24;

ctx.fillStyle = '#000';
ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

let drawing = false;
let lastX = 0, lastY = 0;

function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = CANVAS_SIZE / rect.width;
    const scaleY = CANVAS_SIZE / rect.height;
    return [
        (e.clientX - rect.left) * scaleX,
        (e.clientY - rect.top) * scaleY
    ];
}

function drawDot(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, BRUSH_SIZE / 2, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
}

function drawLine(x1, y1, x2, y2) {
    ctx.lineWidth = BRUSH_SIZE;
    ctx.strokeStyle = '#fff';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
}

// 鼠标事件
canvas.addEventListener('mousedown', e => {
    drawing = true;
    [lastX, lastY] = getCanvasPos(e);
    drawDot(lastX, lastY);
});
canvas.addEventListener('mousemove', e => {
    if (!drawing) return;
    const [x, y] = getCanvasPos(e);
    drawLine(lastX, lastY, x, y);
    [lastX, lastY] = [x, y];
});
document.addEventListener('mouseup', () => drawing = false);

// 触摸事件
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    drawing = true;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    lastX = (touch.clientX - rect.left) * CANVAS_SIZE / rect.width;
    lastY = (touch.clientY - rect.top) * CANVAS_SIZE / rect.height;
    drawDot(lastX, lastY);
});
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!drawing) return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = (touch.clientX - rect.left) * CANVAS_SIZE / rect.width;
    const y = (touch.clientY - rect.top) * CANVAS_SIZE / rect.height;
    drawLine(lastX, lastY, x, y);
    [lastX, lastY] = [x, y];
});
canvas.addEventListener('touchend', e => {
    e.preventDefault();
    drawing = false;
});

// =========================================
// 降采样：手写板 → 8x8 灰阶
// =========================================
function downsampleTo8x8() {
    const imgData = ctx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE).data;

    // 计算质心（用于居中）
    let sumX = 0, sumY = 0, total = 0;
    for (let y = 0; y < CANVAS_SIZE; y++) {
        for (let x = 0; x < CANVAS_SIZE; x++) {
            const v = imgData[(y * CANVAS_SIZE + x) * 4];
            if (v > 0) {
                sumX += x * v;
                sumY += y * v;
                total += v;
            }
        }
    }

    if (total === 0) return new Array(64).fill(0);

    // 质心 → 画布中心
    const cx = sumX / total;
    const cy = sumY / total;
    const dx = CANVAS_SIZE / 2 - cx;
    const dy = CANVAS_SIZE / 2 - cy;

    // 居中 + 轻微高斯模糊（只用于抗锯齿，不扩散笔画）
    const blurred = document.createElement('canvas');
    blurred.width = CANVAS_SIZE;
    blurred.height = CANVAS_SIZE;
    const bCtx = blurred.getContext('2d');
    bCtx.filter = 'blur(4px)';
    bCtx.drawImage(canvas, dx, dy);

    // 降采样到 8x8（浏览器双线性插值）
    const small = document.createElement('canvas');
    small.width = 8;
    small.height = 8;
    const sCtx = small.getContext('2d');
    sCtx.imageSmoothingEnabled = true;
    sCtx.imageSmoothingQuality = 'high';
    sCtx.drawImage(blurred, 0, 0, 8, 8);

    // 读取灰阶像素值
    const smallData = sCtx.getImageData(0, 0, 8, 8);
    const raw = [];
    for (let i = 0; i < 64; i++) {
        raw.push(smallData.data[i * 4] / 255);
    }

    // 对齐训练集特征：
    // 1. 以最大值归一化，确保笔画中心达到 1.0（训练集中 ~18% 非零像素是满值）
    // 2. 裁掉噪声（< 0.1 的极小值置 0，匹配训练集约 50% 零像素的稀疏性）
    // 3. 对剩余值做 gamma 压缩（gamma < 1），使整体分布更接近训练集的均值 ~0.59
    const maxVal = Math.max(...raw);
    const pixels = raw.map(v => {
        if (maxVal === 0) return 0;
        const normalized = v / maxVal;
        if (normalized < 0.1) return 0;               // 去噪：模拟训练集的稀疏性
        return Math.pow(normalized, 0.6);              // gamma=0.6：提升中间值，贴近均值 0.59
    });
    return pixels;
}

// =========================================
// 8x8 预览网格
// =========================================
const previewGrid = document.getElementById('previewGrid');
const previewCells = [];

for (let i = 0; i < 64; i++) {
    const cell = document.createElement('div');
    cell.className = 'preview-cell';
    cell.style.background = '#000';
    previewCells.push(cell);
    previewGrid.appendChild(cell);
}

function updatePreview(pixels) {
    for (let i = 0; i < 64; i++) {
        const v = Math.round(pixels[i] * 255);
        previewCells[i].style.background = `rgb(${v},${v},${v})`;
        if (pixels[i] > 0.05) {
            previewCells[i].textContent = pixels[i].toFixed(1);
            previewCells[i].style.color = pixels[i] > 0.5 ? '#000' : '#aaa';
        } else {
            previewCells[i].textContent = '';
        }
    }
}

// =========================================
// 预测
// =========================================
function predict() {
    const pixels = downsampleTo8x8();
    updatePreview(pixels);

    // logits = x @ W + b
    const logits = [];
    for (let j = 0; j < 10; j++) {
        let s = b[j];
        for (let i = 0; i < 64; i++) {
            s += pixels[i] * W[i][j];
        }
        logits.push(s);
    }

    const probs = softmax(logits);

    let maxIdx = 0;
    for (let i = 1; i < 10; i++) {
        if (probs[i] > probs[maxIdx]) maxIdx = i;
    }

    document.getElementById('prediction').textContent = maxIdx;

    const barsDiv = document.getElementById('bars');
    barsDiv.innerHTML = '';
    for (let i = 0; i < 10; i++) {
        const pct = (probs[i] * 100).toFixed(1);
        const row = document.createElement('div');
        row.className = 'bar-row';
        row.innerHTML = `
            <span class="bar-label">${i}</span>
            <div class="bar-track">
                <div class="bar-fill ${i === maxIdx ? 'top' : ''}" style="width: ${pct}%"></div>
            </div>
            <span class="bar-pct">${pct}%</span>
        `;
        barsDiv.appendChild(row);
    }
}

function clearCanvas() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    document.getElementById('prediction').textContent = '?';
    document.getElementById('bars').innerHTML = '';
    previewCells.forEach(c => {
        c.style.background = '#000';
        c.textContent = '';
    });
}
</script>
